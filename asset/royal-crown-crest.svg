<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 44" width="100" height="44">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffce8"/>
      <stop offset="25%" stop-color="#f8d675"/>
      <stop offset="55%" stop-color="#df9f28"/>
      <stop offset="85%" stop-color="#ffeaa5"/>
      <stop offset="100%" stop-color="#88580c"/>
    </linearGradient>
    <linearGradient id="rubyGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7675"/>
      <stop offset="50%" stop-color="#d63031"/>
      <stop offset="100%" stop-color="#7a0c1e"/>
    </linearGradient>
    <filter id="crestShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(20, 3, 7, 0.8)"/>
    </filter>
  </defs>

  <g filter="url(#crestShadow)">
    <!-- Base Ribbon Platform -->
    <path d="M 20 36 C 35 32 65 32 80 36 C 75 40 25 40 20 36 Z" fill="url(#crestGold)"/>
    
    <!-- Imperial Crown Peaks -->
    <path d="M 24 34 L 28 20 L 38 28 L 50 10 L 62 28 L 72 20 L 76 34 Z" 
          fill="url(#crestGold)" stroke="#fff" stroke-width="0.6"/>
    
    <!-- Crown Carvings -->
    <path d="M 38 28 L 50 20 L 62 28" fill="none" stroke="#fff8e7" stroke-width="1.2"/>
    <path d="M 50 10 L 50 34" fill="none" stroke="#df9f28" stroke-width="1.2"/>

    <!-- Pearl finials on peaks -->
    <circle cx="28" cy="18" r="2.8" fill="#ffffff" stroke="url(#crestGold)" stroke-width="0.8"/>
    <circle cx="72" cy="18" r="2.8" fill="#ffffff" stroke="url(#crestGold)" stroke-width="0.8"/>
    <circle cx="50" cy="8" r="3.8" fill="#ffffff" stroke="url(#crestGold)" stroke-width="1"/>
    
    <!-- Center Royal Ruby Gem -->
    <ellipse cx="50" cy="24" rx="4.5" ry="6" fill="url(#rubyGlow)" stroke="#fff8e7" stroke-width="0.8"/>
    <ellipse cx="49" cy="22" rx="1.5" ry="2.2" fill="#ffffff" opacity="0.85"/>

    <!-- Symmetrical Floral Tendrils Flanking the Crown -->
    <path d="M 22 34 C 14 32 4 28 6 18 C 8 10 18 16 16 22 C 14 26 8 22 10 20" 
          fill="none" stroke="url(#crestGold)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 78 34 C 86 32 96 28 94 18 C 92 10 82 16 84 22 C 86 26 92 22 90 20" 
          fill="none" stroke="url(#crestGold)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="8" cy="12" r="1.8" fill="#fff9e6"/>
    <circle cx="92" cy="12" r="1.8" fill="#fff9e6"/>
  </g>
</svg>
