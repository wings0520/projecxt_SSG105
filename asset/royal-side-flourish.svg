<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 180" width="40" height="180">
  <defs>
    <linearGradient id="goldWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9e6"/>
      <stop offset="20%" stop-color="#f8d675"/>
      <stop offset="50%" stop-color="#df9f28"/>
      <stop offset="80%" stop-color="#f5ce62"/>
      <stop offset="100%" stop-color="#88580c"/>
    </linearGradient>
    <linearGradient id="goldWingSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f8d675" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#88580c" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="wingShadow" x="-30%" y="-10%" width="160%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="rgba(20, 3, 7, 0.7)"/>
    </filter>
  </defs>

  <g filter="url(#wingShadow)">
    <!-- Main Sweeping Ribbon/Wing (Curving out, dipping in, tapering) -->
    <path d="M 38 10 C 20 18 8 45 10 75 C 12 105 32 125 34 150 C 35 162 28 174 20 178 C 30 172 40 156 36 140 C 32 118 14 100 12 76 C 10 52 24 24 38 10 Z" 
          fill="url(#goldWing)" stroke="url(#goldWingSheen)" stroke-width="0.8"/>
    
    <!-- Secondary Inner Accent Curve -->
    <path d="M 39 30 C 26 42 16 62 18 85 C 20 106 32 120 34 135" 
          fill="none" stroke="#fff9e6" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Delicate Filigree Curl at mid-crest -->
    <path d="M 12 76 C 4 72 0 62 4 54 C 8 48 16 50 16 58 C 16 64 10 66 6 62" 
          fill="none" stroke="url(#goldWing)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="5" cy="53" r="1.8" fill="#fffbe8"/>

    <!-- Bottom Curl Detail -->
    <path d="M 34 150 C 38 158 37 168 30 172 C 24 175 18 170 20 164" 
          fill="none" stroke="url(#goldWing)" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="21" cy="177" r="1.5" fill="#f8d675"/>
  </g>
</svg>
