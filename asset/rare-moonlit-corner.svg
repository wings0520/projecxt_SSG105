<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cyanPlatinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#bbfaf6"/>
      <stop offset="55%" stop-color="#00e1d9"/>
      <stop offset="85%" stop-color="#0099ff"/>
      <stop offset="100%" stop-color="#005580"/>
    </linearGradient>
    <filter id="moonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="rgba(0, 225, 217, 0.6)"/>
    </filter>
  </defs>

  <g filter="url(#moonGlow)">
    <!-- Corner Border Lines -->
    <path d="M 6 95 L 6 22 C 6 13 13 6 22 6 L 95 6" fill="none" stroke="url(#cyanPlatinum)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 14 95 L 14 28 C 14 20 20 14 28 14 L 95 14" fill="none" stroke="url(#cyanPlatinum)" stroke-width="0.9" stroke-dasharray="6 3"/>

    <!-- Crescent Moon Corner Accent -->
    <path d="M 32 16 C 24 18 18 24 16 32 C 24 30 30 24 32 16 Z" fill="#ffffff"/>

    <!-- Flowing Celestial Clouds & Star Tendril -->
    <path d="M 28 28 C 22 20 20 10 30 8 C 38 6 42 16 36 22" fill="none" stroke="url(#cyanPlatinum)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 28 28 C 36 22 46 24 50 18 C 54 12 48 6 42 10" fill="none" stroke="url(#cyanPlatinum)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 28 28 C 22 36 24 46 18 50 C 12 54 6 48 10 42" fill="none" stroke="url(#cyanPlatinum)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Cloud Scroll along Top -->
    <path d="M 45 12 C 55 8 68 8 78 12 C 84 14 90 10 94 6" fill="none" stroke="url(#cyanPlatinum)" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="86" cy="11" r="2" fill="#ffffff"/>
    <circle cx="95" cy="5" r="1.5" fill="#bbfaf6"/>

    <!-- Cloud Scroll along Left -->
    <path d="M 12 45 C 8 55 8 68 12 78 C 14 84 10 90 6 94" fill="none" stroke="url(#cyanPlatinum)" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="11" cy="86" r="2" fill="#ffffff"/>
    <circle cx="5" cy="95" r="1.5" fill="#bbfaf6"/>

    <!-- Four-Pointed Star -->
    <path d="M 24 24 L 26 18 L 28 24 L 34 26 L 28 28 L 26 34 L 24 28 L 18 26 Z" fill="#ffffff"/>
  </g>
</svg>
